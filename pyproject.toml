[project]
name = "woodwright"
version = "0.2.0"
description = "A semantic CAD library for woodworking."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bohumir Zamecnik", email = "bohumir.zamecnik@gmail.com" }]
keywords = ["woodworking", "cad", "joinery", "furniture", "build123d", "cut list"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "build123d>=0.13.0"
]

[project.scripts]
woodwright = "woodwright.cli:main"

[project.urls]
Homepage = "https://github.com/bzamecnik/woodwright"
Source = "https://github.com/bzamecnik/woodwright"
Issues = "https://github.com/bzamecnik/woodwright/issues"
Documentation = "https://github.com/bzamecnik/woodwright/tree/HEAD/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woodwright"]

[tool.hatch.build.targets.sdist]
include = ["src/woodwright", "tests", "docs", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
notebook = [
    "jupyter>=1.1.1",
    "jupyter-cadquery>=5.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # lib3mf (imported by build123d) on Python 3.14
    "ignore:Due to '_pack_':DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
