[project]
name = "woodwright"
version = "0.1.0"
description = "A semantic CAD library for woodworking."
readme = "README.md"
authors = [{ name = "Bohumir Zamecnik", email = "bohumir.zamecnik@gmail.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "build123d>=0.13.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woodwright"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
