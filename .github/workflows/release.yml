# A release, on pushing a version tag:
#
#   git tag v0.9.0 && git push origin v0.9.0
#
# Runs the tests, publishes the package on PyPI (trusted publishing: no
# token, PyPI trusts this workflow) and deploys the docs on GitHub Pages.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/woodwright/
    permissions:
      contents: read
      id-token: write # for trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - name: Check that the tag is the version in pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi
      - run: uv build
      - run: uv publish --trusted-publishing always

  docs:
    needs: publish
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
