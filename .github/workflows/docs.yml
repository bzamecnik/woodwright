# The docs on GitHub Pages, with every example exported afresh for the
# gallery (a few minutes). Run by the release, or by hand: Actions > Docs >
# Run workflow (from master, or from a tag to rebuild a release's docs).
name: Docs

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install fonts for the plans (Czech and other non-Latin-1 text)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - run: uv sync --locked --group docs
      - name: Export the examples
        run: uv run woodwright export --all --out build/examples
      - name: Generate the example gallery
        run: uv run docs/gallery.py --exports build/examples
      - run: uv run --group docs zensical build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
